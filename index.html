<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAP Quiz + Flashcards</title>
  <style>
    /* Base Styles */
    body {
      font-family: 'Arial', sans-serif;
      background-color: black;
      color: orange;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .hidden {
      display: none !important;
    }
    .container {
      max-width: 1000px;
      width: 92%;
      margin: 20px auto;
      padding: 20px;
      background-color: grey;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15); /* Added shadow for consistency */
    }

    /* Headings */
    h1, h2, h3 {
      text-align: center;
      color: orange;
      margin-bottom: 10px; /* Added margin for consistency */
    }
    h1 { font-size: 2.2em; }
    h2 { font-size: 1.3em; margin-top: 0; }

    /* Buttons */
    .btn {
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: orange;
      color: white;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s ease, transform 0.2s ease; /* Added transition */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Added shadow for consistency */
    }
    .btn:hover {
      background-color: #d17a00;
      transform: translateY(-2px); /* Added hover effect */
    }
    .btn:active {
      transform: translateY(0); /* Added active effect */
    }
    .disclaimer-btn {
      background-color: grey;
      color: black;
      margin-top: 20px;
      display: block; /* Ensure it takes full width if needed */
      width: 100%; /* Ensure it takes full width if needed */
    }
    .disclaimer-btn:hover {
      background-color: #5a5a5a;
    }
    .back-btn {
      margin-bottom: 20px;
      display: inline-block;
      align-self: flex-start;
      background-color: orange;
      color: white;
    }
    .back-btn:hover {
      background-color: #d17a00;
    }


    /* Top Bar */
    .topbar {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 16px;
      background: rgba(0,0,0,0.85);
      z-index: 1001; /* Ensure topbar is always on top */
      border-bottom: 1px solid rgba(255,165,0,0.25); /* Added border */
    }
    .brand {
      font-weight: 800;
      color: orange;
      letter-spacing: 0.2px; /* Added for consistency */
    }
    .burger {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: #1a1a1a;
      border: 1px solid orange;
      border-radius: 10px;
      cursor: pointer;
    }
    .burger span { /* The middle bar */
      display: block;
      width: 20px;
      height: 2px;
      background: orange;
      position: relative;
    }
    .burger span::before,
    .burger span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: orange;
    }
    .burger span::before { top: -6px; }
    .burger span::after { top: 6px; }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 250px;
      background: #111;
      transform: translateX(-100%);
      transition: transform 0.3s ease; /* Smooth slide-out */
      padding: 20px;
      overflow-y: auto;
      z-index: 1000; /* Sidebar should be below topbar but above overlay */
      border-right: 1px solid rgba(255,165,0,0.25); /* Added border */
      box-shadow: 0 10px 30px rgba(0,0,0,0.35); /* Added shadow */
    }
    .sidebar.open {
      transform: translateX(0);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      z-index: 999; /* Overlay below sidebar */
    }
    .overlay.show {
      display: block;
    }
    .nav-label {
      color: #ffbb55;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 6px 8px; /* Added for consistency */
    }
    .nav-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      background: #222;
      color: orange;
      border: none;
      padding: 10px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer; /* Added for consistency */
      transition: background-color 0.2s ease; /* Added transition */
    }
    .nav-btn:hover {
      background-color: #333; /* Darker hover for nav buttons */
    }


    /* Quiz specific styling */
    .exam-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .question-container {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: orange;
      text-align: center;
    }
    .question-text {
      font-size: 20px;
      color: black;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 20px 0;
    }
    .option-button {
      padding: 12px;
      border: 2px solid orange;
      border-radius: 8px;
      background: #f9f9f9;
      cursor: pointer;
      text-align: left;
      color: black; /* Explicitly set text color for options */
      transition: background-color 0.3s ease, border-color 0.3s ease; /* Added transitions */
    }
    .option-button:hover:not([disabled]) {
      background-color: #ffd9a8; /* Lighter orange on hover */
      border-color: #c0c0c0;
    }
    .option-button.correct {
      background: #d4edda; /* Green */
      color: #155724;
      border-color: #c3e6cb;
    }
    .option-button.wrong {
      background: #f8d7da; /* Red */
      color: #721c24;
      border-color: #f5c6cb;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #e9ecef;
      border-radius: 5px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background: orange;
      transition: width 0.4s ease;
    }

    /* Results Page */
    .results-summary {
      text-align: center;
      margin-top: 20px;
    }
    .results-summary h2 {
      font-size: 28px;
      color: orange;
      margin-bottom: 10px;
    }
    .results-summary p {
      font-size: 22px;
      color: black;
      margin-bottom: 30px;
    }
    .results-actions {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .results-actions button {
      width: 100%;
    }


    /* Flashcards */
    .flashcard {
      perspective: 1200px;
      width: 100%;
      height: 220px;
      margin: auto;
      cursor: pointer; /* Indicate it's clickable */
    }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      border: 2px solid orange;
      border-radius: 12px;
      background: #1a1a1a;
      color: orange;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; /* Hide back of card when front is shown */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card-face.back {
      transform: rotateY(180deg);
      background: #111; /* Slightly different background for the back */
    }
    .flashcard-controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="burger" id="burger"><span></span></button>
    <div class="brand">AAP Study Hub</div>
  </div>

  <aside id="sidebar" class="sidebar">
    <button class="nav-btn" data-target="exams-section">📘 Exams</button>
    <button class="nav-btn" data-target="flashcards-section">🃏 General Flash Cards</button>
    <button class="nav-btn" data-target="trauma-flashcards-section">💥 Trauma Cards</button>
  </aside>
  <div id="overlay" class="overlay"></div>

  <!-- Exams Section -->
  <section id="exams-section" class="container">
    <h1>AAP Quiz Exam List</h1>
    <div id="exam-buttons" class="exam-list"></div>
  </section>

  <!-- Quiz App Section -->
  <section id="quiz-app" class="container hidden">
    <button class="btn back-btn" id="back-btn">&larr; Back to Contents</button>
    <div class="progress-bar"><div id="progress-bar-inner" class="progress-bar-inner"></div></div>
    <div class="question-container">
      <p class="question-text" id="question"></p>
    </div>
    <div class="options" id="options"></div>
  </section>

  <!-- Results Page Section -->
  <section id="results-page" class="container hidden">
    <h2>Quiz Complete!</h2>
    <p id="final-score"></p>
    <div class="results-actions">
        <button class="btn" id="retake-quiz-btn">Retake Quiz</button>
        <button class="btn" id="return-to-contents-btn">Back to Contents</button>
    </div>
  </section>

  <!-- General Flashcards Section -->
  <section id="flashcards-section" class="container hidden">
    <h1>General Flash Cards</h1>
    <div id="general-flashcard-container"></div>
    <div class="flashcard-controls">
      <button class="btn" id="general-flip-btn">Flip</button>
      <button class="btn" id="general-next-btn">Next</button>
    </div>
  </section>

  <!-- Trauma Flashcards Section -->
  <section id="trauma-flashcards-section" class="container hidden">
    <h1>Trauma Flash Cards</h1>
    <div id="trauma-flashcard-container"></div>
    <div class="flashcard-controls">
      <button class="btn" id="trauma-flip-btn">Flip</button>
      <button class="btn" id="trauma-next-btn">Next</button>
    </div>
  </section>

  <script>

    // Quiz Data (Trauma Exam)
    const exams = [{

        { question: "What is the definition of 'Trauma'?", options: ["Any injury caused by a fall", "Acute physiological/structural change from external energy", "Minor injury", "Psychological distress"], correctAnswerIndex: 1 },

        { question: "What is the definition of 'Trauma' according to the provided materials?", options: ["Any injury caused by a fall from height.", "The acute physiological and structural change that occurs in a patient’s body when an external source of energy transfers to the body faster than the body’s ability to sustain and dissipate it.", "A minor injury that does not require hospital admission.", "A psychological response to a distressing event."], correctAnswerIndex: 1 },
        { question: "How is 'Major Trauma' defined?", options: ["An injury requiring only basic first aid.", "An injury that is life-threatening but not life-changing.", "An injury or combination of injuries that are life-threatening and could be life changing because it may result in long-term disability.", "Any injury sustained in a road traffic collision."], correctAnswerIndex: 2 },
        { question: "Which of the following is NOT listed as a leading cause of trauma in the provided documents?", options: ["Road Traffic Collisions (RTC)", "Falls in people over the age of 75", "Work-related accidents", "Sports injuries in children"], correctAnswerIndex: 3 },

        { question: "Which term is defined as 'the study of the relationship between motion and its forces'?", options: ["Thermodynamics", "Kinetics", "Statics", "Dynamics"], correctAnswerIndex: 1 },

        { question: "Why is considering the Mechanism of Injury (MOI) important in trauma patients?", options: ["It helps determine the patient's insurance coverage.", "It provides an idea of the extent of injury, may indicate internal injuries, assists in determining appropriate destination, and allows for immobilisation decisions.", "It is only relevant for penetrating trauma.", "It solely dictates the type of pain relief to be administered."], correctAnswerIndex: 1 },
        { question: "What is 'Blunt Trauma'?", options: ["An injury caused by a sharp object piercing the skin.", "An injury resulting from a fall from a low height.", "A usually serious injury caused by a blunt object or collision with a blunt surface.", "An injury that only affects soft tissues without breaking the skin."], correctAnswerIndex: 2 },

      }

      container.innerHTML = `
        <div class='flashcard ${isFlipped ? 'flipped' : ''}'>
          <div class='flashcard-inner' role='button' tabindex='0' aria-pressed='false' aria-label='Flip card'>
            <div class='card-face front'><strong>Q:</strong> ${card.q}</div>
            <div class='card-face back'><strong>A:</strong> ${card.a}</div>
          </div>
        </div>`;

      // Attach click listener for flipping
      container.querySelector('.flashcard').onclick = () => {
        if (containerId === 'general-flashcard-container') {
          isGeneralCardFlipped = !isGeneralCardFlipped;
        } else if (containerId === 'trauma-flashcard-container') {
          isTraumaCardFlipped = !isTraumaCardFlipped;
        }
        // Re-render to apply flip class
        renderFlashcard(cardsArray, currentIndex, containerId);
      };

      // Attach keypress listener for accessibility
      container.querySelector('.flashcard').onkeypress = (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          if (containerId === 'general-flashcard-container') {
            isGeneralCardFlipped = !isGeneralCardFlipped;
          } else if (containerId === 'trauma-flashcard-container') {
            isTraumaCardFlipped = !isTraumaCardFlipped;
          }
          renderFlashcard(cardsArray, currentIndex, containerId);
        }
      };
    }

    // Initial render for both flashcard sets
    renderFlashcard(generalFlashcards, generalFlashIndex, 'general-flashcard-container');
    renderFlashcard(traumaFlashcards, traumaFlashIndex, 'trauma-flashcard-container');


    // General Flashcards Controls
    document.getElementById('general-flip-btn').onclick = () => {
      isGeneralCardFlipped = !isGeneralCardFlipped;
      renderFlashcard(generalFlashcards, generalFlashIndex, 'general-flashcard-container');
    };
    document.getElementById('general-next-btn').onclick = () => {
      generalFlashIndex = (generalFlashIndex + 1) % generalFlashcards.length;
      isGeneralCardFlipped = false; // Flip back to front for next card
      renderFlashcard(generalFlashcards, generalFlashIndex, 'general-flashcard-container');
    };

    // Trauma Flashcards Controls
    document.getElementById('trauma-flip-btn').onclick = () => {
      isTraumaCardFlipped = !isTraumaCardFlipped;
      renderFlashcard(traumaFlashcards, traumaFlashIndex, 'trauma-flashcard-container');
    };
    document.getElementById('trauma-next-btn').onclick = () => {
      traumaFlashIndex = (traumaFlashIndex + 1) % traumaFlashcards.length;
      isTraumaCardFlipped = false; // Flip back to front for next card
      renderFlashcard(traumaFlashcards, traumaFlashIndex, 'trauma-flashcard-container');
    };
  </script>
</body>
</html>
